name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! exige que frontendDist exista.
      - run: mkdir -p dist
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    # windows-2022, não windows-latest (2025): no 2025 o msedgedriver não
    # consegue abrir o WebView2 ("DevToolsActivePort file doesn't exist"),
    # regressão do WebView2 a partir da versão 133, sem correção até agora:
    # https://github.com/actions/runner-images/issues/14738
    # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5415
    # Na máquina de desenvolvimento o smoke passa com o WebView2 156.
    #
    # Por isso o smoke NÃO BLOQUEIA o PR: se falhar, o job fica verde com um
    # aviso no resumo da execução. Antes do merge, rode-o localmente
    # (README, "Smoke"). Volte a bloquear quando o upstream corrigir.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
      - run: msedgedriver-tool
      - run: npm run tauri build -- --debug --no-bundle
      - id: smoke
        run: npm run test:smoke
        continue-on-error: true
      - if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          msg="Smoke falhou no CI (regressão conhecida do WebView2 nos runners Windows). Não bloqueia o PR: rode npm run test:smoke localmente antes do merge."
          echo "::warning title=Smoke não verificado no CI::$msg"
          echo "### ⚠️ Smoke não verificado no CI" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
